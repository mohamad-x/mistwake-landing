<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">MistWake Kickstarter Follow Guide</title>
  <desc id="desc">Four steps to follow MistWake on Kickstarter and back the project at launch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f4f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <g transform="translate(70 70)">
    <text x="0" y="75" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#111">MistWake</text>
    <text x="0" y="150" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" fill="#f26a00">KICKSTARTER</text>
    <text x="0" y="235" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" fill="#111">FOLLOW GUIDE</text>
    <text x="0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#333">Follow these steps after reserving VIP access.</text>
  </g>

  <g transform="translate(70 390)" filter="url(#shadow)">
    <rect width="1060" height="205" rx="30" fill="#fff" stroke="#ead6c7"/>
    <circle cx="95" cy="102" r="58" fill="#111"/>
    <text x="72" y="124" font-family="Arial" font-size="62" font-weight="800" fill="#f26a00">1</text>
    <text x="195" y="78" font-family="Arial" font-size="36" font-weight="800" fill="#111">CREATE OR SIGN INTO KICKSTARTER</text>
    <text x="195" y="132" font-family="Arial" font-size="29" fill="#333">Use your Kickstarter account so you can get notified</text>
    <text x="195" y="170" font-family="Arial" font-size="29" fill="#333">when MistWake launches.</text>
  </g>

  <g transform="translate(70 635)" filter="url(#shadow)">
    <rect width="1060" height="205" rx="30" fill="#fff" stroke="#ead6c7"/>
    <circle cx="95" cy="102" r="58" fill="#111"/>
    <text x="72" y="124" font-family="Arial" font-size="62" font-weight="800" fill="#f26a00">2</text>
    <text x="195" y="78" font-family="Arial" font-size="36" font-weight="800" fill="#111">OPEN THE MISTWAKE PAGE</text>
    <text x="195" y="132" font-family="Arial" font-size="29" fill="#333">Use the Kickstarter button on this page or search</text>
    <text x="195" y="170" font-family="Arial" font-size="29" fill="#333">“MistWake” on Kickstarter.</text>
  </g>

  <g transform="translate(70 880)" filter="url(#shadow)">
    <rect width="1060" height="205" rx="30" fill="#fff" stroke="#ead6c7"/>
    <circle cx="95" cy="102" r="58" fill="#111"/>
    <text x="72" y="124" font-family="Arial" font-size="62" font-weight="800" fill="#f26a00">3</text>
    <text x="195" y="78" font-family="Arial" font-size="36" font-weight="800" fill="#111">CLICK NOTIFY ME ON LAUNCH</text>
    <text x="195" y="132" font-family="Arial" font-size="29" fill="#333">Kickstarter will remind you when the campaign</text>
    <text x="195" y="170" font-family="Arial" font-size="29" fill="#333">goes live.</text>
  </g>

  <g transform="translate(70 1125)" filter="url(#shadow)">
    <rect width="1060" height="205" rx="30" fill="#fff" stroke="#ead6c7"/>
    <circle cx="95" cy="102" r="58" fill="#111"/>
    <text x="72" y="124" font-family="Arial" font-size="62" font-weight="800" fill="#f26a00">4</text>
    <text x="195" y="78" font-family="Arial" font-size="36" font-weight="800" fill="#111">BACK THE PROJECT AT LAUNCH</text>
    <text x="195" y="132" font-family="Arial" font-size="29" fill="#333">When the campaign opens, choose your reward</text>
    <text x="195" y="170" font-family="Arial" font-size="29" fill="#333">and complete your pledge.</text>
  </g>
</svg>