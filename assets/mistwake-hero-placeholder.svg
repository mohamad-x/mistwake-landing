  <path d="M1270 305 C1395 280 1480 240 1530 190" fill="none" stroke="#e6e6e6" stroke-opacity=".28" stroke-width="10" stroke-linecap="round"/>
  <circle cx="180" cy="725" r="20" fill="url(#accent)"/><text x="220" y="737" fill="#f7f1e8" font-family="Arial" font-size="28" font-weight="700">Recommended size: 1600×900 or 16:9</text>
