<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="MistWake hero image placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14181d"/><stop offset="1" stop-color="#251b13"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb84d"/><stop offset="1" stop-color="#d98b1f"/></linearGradient>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect x="46" y="46" width="1508" height="808" rx="30" fill="none" stroke="#ffb84d" stroke-opacity=".45" stroke-width="4" stroke-dasharray="18 16"/>
  <text x="90" y="120" fill="#ffb84d" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="5">HERO IMAGE PLACEHOLDER</text>
  <text x="90" y="230" fill="#f7f1e8" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800">MistWake beside bed</text>
  <text x="90" y="310" fill="#b9b3aa" font-family="Arial, Helvetica, sans-serif" font-size="34">Replace this file with the final landing-page hero image.</text>
  <text x="90" y="380" fill="#b9b3aa" font-family="Arial, Helvetica, sans-serif" font-size="31">Required: product on nightstand, bed/pillow visible, nozzle aimed at pillow,</text>
  <text x="90" y="425" fill="#b9b3aa" font-family="Arial, Helvetica, sans-serif" font-size="31">fine mist visible, waterproof mat underneath, no text overlays.</text>
